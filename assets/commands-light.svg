" y="439" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#1c1e21" text-anchor="start" xml:space="preserve">Send the phrase as it is dictated</text><text x="1200" y="439" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#9aa0a6" text-anchor="end" xml:space="preserve">voice</text><text x="88" y="497" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#1c1e21" text-anchor="start" xml:space="preserve">Save the settings to a file</text><text x="1200" y="497" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#9aa0a6" text-anchor="end" xml:space="preserve">settings</text><rect x="1265" y="481" width="49" height="22" rx="5" fill="#e2e2e3"/><text x="1289.5" y="497" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#6b7076" text-anchor="middle" xml:space="preserve">⌘⌥S</text><text x="88" y="555" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#1c1e21" text-anchor="start" xml:space="preserve">Show the dock</text><text x="1200" y="555" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#9aa0a6" text-anchor="end" xml:space="preserve">window</text><rect x="1265" y="539" width="49" height="22" rx="5" fill="#e2e2e3"/><text x="1289.5" y="555" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#6b7076" text-anchor="middle" xml:space="preserve">⌘⇧B</text><text x="86" y="618" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#6b7076" text-anchor="start" xml:space="preserve">A button, a key, the menu bar, this list and the comma