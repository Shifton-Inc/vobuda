bb26" stroke="#2f3135"/><rect x="362" y="360" width="14" height="16" rx="3" fill="#fabd2f" stroke="#2f3135"/><rect x="380" y="360" width="14" height="16" rx="3" fill="#d3869b" stroke="#2f3135"/><text x="416" y="374" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#d6d9de" text-anchor="start" xml:space="preserve">Gruvbox</text><rect x="308" y="406" width="14" height="16" rx="3" fill="#101418" stroke="#2f3135"/><rect x="326" y="406" width="14" height="16" rx="3" fill="#56b4e9" stroke="#2f3135"/><rect x="344" y="406" width="14" height="16" rx="3" fill="#009e73" stroke="#2f3135"/><rect x="362" y="406" width="14" height="16" rx="3" fill="#f0e442" stroke="#2f3135"/><rect x="380" y="406" width="14" height="16" rx="3" fill="#cc79a7" stroke="#2f3135"/><text x="416" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#d6d9de" text-anchor="start" xml:space="preserve">Colour-vision safe</text><text x="680" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#8b9099" text-anchor="start" xml:space="preserve">WHAT THIS THEME IS LIKE TO READ</text><rect x="680" y="160" width="632" height="184" rx="9" fill="#1b1e23" stroke="#2f3135"/><text x="698" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#d6d9de" text-anchor="start" xml:space="preserve">text contrast</text><text x="1294" y="192" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#66bb6a" text-anchor="end" xml:space="preserve">12.4 : 1</text><text x="698" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#5d636c" text-anchor="start" xml:space="preserve">well past the 4.5 a small size needs</text><text x="698" y="246" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#d6d9de" text-anchor="start" xml:space="preserve">colour-blind distinguishability</text><text x="1294" y="246" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#66bb6a" text-anchor="end" xml:space="preserve">good</text><text x="698" y="266" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#5d636c" text-anchor="start" xml:space="preserve">checked against three forms of it</text><text x="698" y="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#d6d9de" text-anchor="start" xml:space="preserve">Minimum contrast</text><text x="1294" y="300" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#8b9099" text-anchor="end" xml:space="preserve">4.5 : 1</text><text x="698" y="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#5d636c" text-anchor="start" xml:space="preserve">the floor this palette is held to</text><text x="680" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#8b9099" text-anchor="start" xml:space="preserve">AND WHAT IT LOOKS LIKE</text><rect x="680" y="394" width="632" height="150" rx="9" fill="#0f1115" stroke="#2f3135"/><text x="698" y="422" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#d6d9de" text-anchor="start" xml:space="preserve">$ npm run build</text><text x="698" y="448" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#66bb6a" text-anchor="start" xml:space="preserve">  built in 4.1s</text><text x="698" y="474" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#ffca28" text-anchor="start" xml:space="preserve">  2 warnings</text><text x="698" y="500" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#d6d9de" text-anchor="start" xml:space="preserve">$ </text><text x="308" y="606" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#8b9099" text-anchor="start" xml:space="preserve">A theme is a file. Drop one in the folder and it is in the list; edit it and the window redraws.</text></svg>