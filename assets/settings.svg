="start" xml:space="preserve">window</text><text x="88" y="324" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#8b9099" text-anchor="start" xml:space="preserve">buttons</text><text x="88" y="368" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#8b9099" text-anchor="start" xml:space="preserve">agents</text><text x="88" y="412" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#8b9099" text-anchor="start" xml:space="preserve">keys</text><text x="88" y="456" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#8b9099" text-anchor="start" xml:space="preserve">signals</text><text x="88" y="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#8b9099" text-anchor="start" xml:space="preserve">faults</text><text x="308" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#8b9099" text-anchor="start" xml:space="preserve">THEME</text><rect x="298" y="164" width="330" height="40" rx="8" fill="#2a2d33"/><rect x="308" y="176" width="14" height="16" rx="3" fill="#17191d" stroke="#2f3135"/><rect x="326" y="176" width="14" height="16" rx="3" fill="#42a5f5" stroke="#2f3135"/><rect x="344" y="176" width="14" height="16" rx="3" fill="#66bb6a" stroke="#2f3135"/><rect x="362" y="176" width="14" height="16" rx="3" fill="#ffca28" stroke="#2f3135"/><rect x="380" y="176" width="14" height="16" rx="3" fill="#ab47bc" stroke="#2f3135"/><text x="416" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#d6d9de" text-anchor="start" xml:space="preserve">Dark</text><rect x="308" y="222" width="14" height="16" rx="3" fill="#ffffff" stroke="#2f3135"/><rect x="326" y="22